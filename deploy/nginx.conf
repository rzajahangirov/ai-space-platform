# Load balancer in front of the API replicas (docker compose service "app", scaled with --scale or
# deploy.replicas). Docker DNS returns every replica; nginx re-resolves it every 10 s.
worker_processes auto;
events { worker_connections 8192; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream agentspace_api {
    least_conn;
    zone agentspace_api 64k;
    server app:3001 resolve max_fails=3 fail_timeout=10s;
    server worker:3001 backup;
    keepalive 128;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://agentspace_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      # WebSocket (/api/projects/:id/live) and keep-alive to the replicas.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      # Retry idempotent requests on another replica when one fails to answer.
      proxy_next_upstream error timeout http_502 http_503;
    }
    location = /lb/health { return 200 'ok'; }
  }
}
